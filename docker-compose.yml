version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: jeweltrack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-jeweltrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jeweltrack-network

  # -------------------------------------------------------------
  # 2. NestJS Backend API Service
  # -------------------------------------------------------------
  api:
    build:
      context: ./jeweltrack-api
      dockerfile: Dockerfile
    container_name: jeweltrack_api
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME:-jeweltrack_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      - postgres-db
    networks:
      - jeweltrack-network

  # -------------------------------------------------------------
  # 3. Next.js Frontend Service
  # -------------------------------------------------------------
  web:
    build:
      context: ./jeweltrack-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
    container_name: jeweltrack_web
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
    depends_on:
      - api
    networks:
      - jeweltrack-network

volumes:
  postgres_data:

networks:
  jeweltrack-network:
    driver: bridge
